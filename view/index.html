<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Gateway Chat — View</title>
    <link rel="stylesheet" href="../lib/nui_wc2/NUI/css/nui-theme.css">
    <link rel="stylesheet" href="css/view.css">
</head>
<body>
    <div id="v-login" style="display:none">
        <form id="v-login-form" onsubmit="return false">
            <h2>Sign in</h2>
            <input id="login-user" placeholder="username" autocomplete="username">
            <input id="login-pass" type="password" placeholder="password" autocomplete="current-password">
            <div id="login-err"></div>
            <button id="login-btn" type="button">Log in</button>
        </form>
    </div>

    <div id="v-app">
        <aside id="v-side">
            <div class="side-head">
                <span class="brand">Gateway Chat <em>view</em></span>
                <button id="v-refresh" title="Refresh">⟳</button>
            </div>
            <button id="v-new" class="new-chat">+ New chat</button>
            <div id="v-chats"></div>
            <div class="side-panel">
                <label>System prompt (user portion)</label>
                <textarea id="v-sysprompt" rows="6" placeholder="Per-chat system prompt…"></textarea>
            </div>
        </aside>

        <main id="v-main">
            <header id="v-topbar">
                <input id="v-title" placeholder="Conversation title">
                <select id="v-model"></select>
            </header>
            <div id="v-msgs"></div>
            <footer id="v-inputbar">
                <textarea id="v-input" rows="2" placeholder="Message… (Enter to send, Shift+Enter for newline)"></textarea>
                <div class="input-actions">
                    <button id="v-send">Send</button>
                    <button id="v-abort" style="display:none">Abort</button>
                </div>
            </footer>
        </main>
    </div>

    <script src="../lib/nui_wc2/NUI/nui.js" type="module"></script>
    <script src="js/app.js" type="module"></script>
</body>
</html>
